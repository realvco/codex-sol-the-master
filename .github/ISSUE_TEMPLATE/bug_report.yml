name: Bug report
description: Report a documentation or example mismatch
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, private logs, tokens, or personal absolute paths.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Codex version
      description: Include the client version if the issue is runtime-related.
    validations:
      required: false
